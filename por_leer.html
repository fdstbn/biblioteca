<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Por leer · BBL_PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F4EFE3;
    --paper-raised:#FAF7EF;
    --ink:#2B2319;
    --ink-soft:#6B6153;
    --rule:#DBD0B8;
    --burgundy:#7C2E27;
    --forest:#4C5A3E;
    --forest-soft:#EDF0E3;
    --gold:#B8860B;
    --shadow: 0 1px 2px rgba(43,35,25,0.06), 0 8px 20px -12px rgba(43,35,25,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,35,25,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--forest-soft); }

  a{color:inherit;}
  .mono{ font-family:'Space Mono', monospace; letter-spacing:0.02em; }
  .smallcaps{ font-variant:small-caps; letter-spacing:0.06em; }

  header.top{
    max-width:1180px; margin:0 auto; padding:56px 28px 20px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--rule);
  }
  .title-block h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(2.1rem, 4vw, 3rem);
    margin:0 0 6px; letter-spacing:-0.01em;
  }
  .title-block .sub{
    color:var(--ink-soft); font-family:'Space Mono', monospace; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:0.1em;
  }
  .top-actions{ display:flex; gap:10px; padding-bottom:6px; flex-wrap:wrap; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn{
    font-family:'Space Mono', monospace; font-size:0.78rem; text-transform:uppercase;
    letter-spacing:0.06em; padding:11px 18px; border-radius:3px; border:1px solid var(--ink);
    background:transparent; color:var(--ink); transition:all .15s ease;
  }
  .btn:hover{ background:var(--ink); color:var(--paper); }
  .btn.primary{ background:var(--forest); color:#fff; border-color:var(--forest); }
  .btn.primary:hover{ background:#3d4831; border-color:#3d4831; }
  .btn.ghost{ border-color:var(--rule); color:var(--ink-soft); }
  .btn.ghost:hover{ background:var(--ink-soft); border-color:var(--ink-soft); color:#fff; }
  .btn.danger{ border-color:var(--burgundy); color:var(--burgundy); }
  .btn.danger:hover{ background:var(--burgundy); border-color:var(--burgundy); color:#fff; }

  main{ max-width:1180px; margin:0 auto; padding:34px 28px 90px; }

  /* Stats strip */
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
    background:var(--rule); border:1px solid var(--rule); margin-bottom:34px; border-radius:4px; overflow:hidden;
  }
  .stat{ background:var(--paper-raised); padding:18px 20px; }
  .stat .num{ font-family:'Fraunces', serif; font-weight:600; font-size:1.9rem; line-height:1; }
  .stat .lbl{ font-family:'Space Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-top:6px; }

  /* Breakdown bars */
  .breakdowns{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:40px; }
  @media (max-width:720px){ .breakdowns{ grid-template-columns:1fr; } }
  .breakdown-card{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:18px 20px; }
  .breakdown-card h3{
    font-family:'Space Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); margin:0 0 14px; font-weight:700;
  }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:0.85rem; }
  .bar-row .name{ width:38%; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .bar-track{ flex:1; height:8px; background:var(--rule); border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--forest); border-radius:2px; }
  .bar-row .count{ font-family:'Space Mono', monospace; font-size:0.75rem; color:var(--ink-soft); width:20px; text-align:right; }
  .empty-note{ color:var(--ink-soft); font-size:0.85rem; font-style:italic; }

  /* Toolbar */
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  input[type="text"], select, textarea{
    font-family:'Source Serif 4', serif; font-size:0.95rem; color:var(--ink);
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:3px;
    padding:11px 14px; width:100%;
  }
  input[type="text"]:focus, select:focus, textarea:focus{ outline:none; border-color:var(--forest); }
  select{ font-family:'Space Mono', monospace; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; width:auto; }
  .toolbar-selects{ display:flex; gap:10px; flex-wrap:wrap; }
  .count-line{ font-family:'Space Mono', monospace; font-size:0.75rem; color:var(--ink-soft); margin-bottom:18px; text-transform:uppercase; letter-spacing:0.04em; }

  /* Grid & cards */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:18px; }
  .card{
    position:relative; background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px;
    padding:20px 20px 18px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:10px; min-height:170px;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 4px 6px rgba(43,35,25,0.08), 0 14px 26px -14px rgba(43,35,25,0.35); }

  .ribbon{
    position:absolute; top:-2px; right:18px; background:var(--burgundy); color:#fff;
    font-family:'Fraunces', serif; font-weight:600; font-size:0.78rem;
    padding:5px 10px 8px; border-radius:0 0 3px 3px;
    box-shadow:0 3px 5px rgba(0,0,0,0.18);
  }
  .ribbon::after{
    content:""; position:absolute; bottom:-6px; right:0; border-style:solid;
    border-width:0 9px 6px 0; border-color:transparent #4a1a15 transparent transparent;
  }

  .card h2{ font-family:'Fraunces', serif; font-weight:600; font-size:1.18rem; line-height:1.25; margin:6px 0 0; padding-right:36px; }
  .card .autor{ font-family:'Fraunces', serif; font-style:italic; color:var(--burgundy); font-size:0.95rem; }
  .card .editorial{ font-family:'Space Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }
  .card .lista-tag{ font-family:'Space Mono', monospace; font-size:0.68rem; color:var(--forest); background:var(--forest-soft); padding:3px 8px; border-radius:20px; display:inline-block; width:fit-content; }
  .card .tematica{ font-size:0.8rem; color:var(--ink-soft); }
  .card .referencia{ font-size:0.83rem; color:var(--ink); font-style:italic; border-left:2px solid var(--rule); padding-left:10px; margin-top:2px; }
  .card .status-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:8px; }
  .status-badge{ font-family:'Space Mono', monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft); }
  .status-badge.on.leido{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .status-badge.on.tengo{ background:var(--gold); border-color:var(--gold); color:#fff; }

  .toggle-group{ display:flex; gap:8px; }
  .toggle-btn{
    flex:1; font-family:'Space Mono', monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;
    padding:9px 10px; border-radius:3px; border:1px solid var(--rule); background:var(--paper-raised); color:var(--ink-soft);
    cursor:pointer; transition:all .12s ease;
  }
  .toggle-btn.active{ background:var(--forest); border-color:var(--forest); color:#fff; }

  .star-picker{ display:flex; gap:4px; }
  .star-btn{ background:transparent; border:none; font-size:1.6rem; line-height:1; color:var(--rule); cursor:pointer; padding:2px; transition:color .1s ease, transform .1s ease; }
  .star-btn:hover{ transform:scale(1.15); }
  .star-btn.filled{ color:var(--gold); }

  .card .fav-stars{ font-size:0.85rem; color:var(--gold); letter-spacing:1px; }

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--ink-soft); border:1px dashed var(--rule); border-radius:6px; background:var(--paper-raised);
  }
  .empty-state h3{ font-family:'Fraunces', serif; font-size:1.4rem; color:var(--ink); margin-bottom:8px; }
  .empty-state p{ max-width:420px; margin:0 auto 20px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(43,35,25,0.45); display:none; align-items:center; justify-content:center;
    padding:24px; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper); border-radius:6px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
    padding:30px 32px; box-shadow:0 20px 50px rgba(0,0,0,0.3); border:1px solid var(--rule);
  }
  .modal h2{ font-family:'Fraunces', serif; font-size:1.5rem; margin:0 0 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'Space Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); margin-bottom:6px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:18px; border-top:1px solid var(--rule); }
  .modal-actions .right{ display:flex; gap:10px; }

  .fab{
    position:fixed; bottom:28px; right:28px; z-index:40;
    display:flex; align-items:center; gap:8px;
    padding:14px 20px; border-radius:30px; background:var(--forest); color:#fff;
    font-family:'Space Mono', monospace; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em;
    box-shadow:0 8px 24px -6px rgba(76,90,62,0.55);
  }
  .fab:hover{ background:#3d4831; }

  footer{ text-align:center; padding:30px; color:var(--ink-soft); font-family:'Space Mono', monospace; font-size:0.7rem; letter-spacing:0.05em; }

  @media (max-width:520px){
    header.top{ padding:36px 18px 16px; }
    main{ padding:24px 18px 90px; }
    .modal{ padding:22px 20px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="title-block">
    <h1>Por leer</h1>
    <div class="sub">Pila de lectura · BBL_PL.xlsx</div>
  </div>
  <div class="top-actions">
    <a class="btn ghost" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center;">↩ Ver libros leídos</a>
    <button class="btn ghost" id="btnDownload">↓ Descargar Excel</button>
  </div>
</header>

<main>

  <div class="stats" id="statsStrip"></div>

  <div class="breakdowns">
    <div class="breakdown-card">
      <h3>Por lista de origen</h3>
      <div id="breakdownLista"></div>
    </div>
    <div class="breakdown-card">
      <h3>Por temática</h3>
      <div id="breakdownTematica"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar por título, autor, editorial, temática, lista o estado (leído, tengo…)…">
    </div>
    <div class="toolbar-selects">
      <select id="sortSelect">
        <option value="favorito">Favoritos primero</option>
        <option value="orden">Orden (posición en lista)</option>
        <option value="titulo">Título A–Z</option>
        <option value="autor">Autor A–Z</option>
        <option value="editorial">Editorial A–Z</option>
        <option value="reciente">Añadidos recientemente</option>
      </select>
      <select id="favoritoFilter">
        <option value="">Favoritos · todos</option>
        <option value="1">★ o más</option>
        <option value="2">★★ o más</option>
        <option value="3">★★★</option>
      </select>
      <select id="listaFilter">
        <option value="">Todas las listas</option>
      </select>
      <select id="leidoFilter">
        <option value="">Leído · todos</option>
        <option value="si">Leído</option>
        <option value="no">No leído</option>
      </select>
      <select id="tengoFilter">
        <option value="">Tengo · todos</option>
        <option value="si">Tengo</option>
        <option value="no">Por comprar</option>
      </select>
    </div>
  </div>

  <div class="count-line" id="countLine"></div>

  <div class="grid" id="grid"></div>

</main>

<button class="fab" id="btnAdd">+ Añadir libro</button>

<footer>BBL_PL · pila de lectura personal · exporta y guarda tus cambios en Excel</footer>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Añadir libro</h2>
    <form id="bookForm">
      <div class="field">
        <label for="f_titulo">Título</label>
        <input type="text" id="f_titulo" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f_autor">Autor</label>
          <input type="text" id="f_autor">
        </div>
        <div class="field">
          <label for="f_editorial">Editorial</label>
          <input type="text" id="f_editorial">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f_lista">Lista de origen (opcional)</label>
          <input type="text" id="f_lista" placeholder="p. ej. 100 mejores del s. XXI — NYT">
        </div>
        <div class="field" style="max-width:120px;">
          <label for="f_orden">Posición nº</label>
          <input type="text" id="f_orden" inputmode="numeric" placeholder="12">
        </div>
      </div>
      <div class="field">
        <label for="f_tematica">Temática / género</label>
        <input type="text" id="f_tematica">
      </div>
      <div class="field">
        <label for="f_referencia">Nota / referencia breve</label>
        <textarea id="f_referencia" rows="3" placeholder="Por qué está en la lista, quién lo recomendó, de dónde salió…"></textarea>
      </div>
      <div class="field">
        <label>Favorito</label>
        <div class="star-picker" id="starPicker">
          <button type="button" class="star-btn" data-value="1">★</button>
          <button type="button" class="star-btn" data-value="2">★</button>
          <button type="button" class="star-btn" data-value="3">★</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Lectura</label>
          <div class="toggle-group" id="toggleLeido">
            <button type="button" class="toggle-btn" data-value="no">No leído</button>
            <button type="button" class="toggle-btn" data-value="si">Leído</button>
          </div>
        </div>
        <div class="field">
          <label>Posesión</label>
          <div class="toggle-group" id="toggleTengo">
            <button type="button" class="toggle-btn" data-value="no">Por comprar</button>
            <button type="button" class="toggle-btn" data-value="si">Tengo</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="btnDelete" style="display:none;">Eliminar</button>
        <div class="right">
          <button type="button" class="btn ghost" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn primary">Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>

let editingId = null;
let nextId = 485;

const $ = sel => document.querySelector(sel);
const grid = $('#grid');
const overlay = $('#overlay');
const form = $('#bookForm');

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderStats();
  renderBreakdowns();
  renderGrid();
  renderListaFilterOptions();
}

function renderStats(){
  const total = books.length;
  const listas = new Set(books.map(b=>b.lista).filter(Boolean)).size;
  const tematicas = new Set(books.map(b=>b.tematica).filter(Boolean)).size;
  const autores = new Set(books.map(b=>b.autor).filter(Boolean)).size;
  const leidos = books.filter(b=>b.leido).length;
  const tengo = books.filter(b=>b.tengo).length;
  $('#statsStrip').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Libros en la pila</div></div>
    <div class="stat"><div class="num">${listas}</div><div class="lbl">Listas de origen</div></div>
    <div class="stat"><div class="num">${tematicas}</div><div class="lbl">Temáticas</div></div>
    <div class="stat"><div class="num">${autores}</div><div class="lbl">Autores distintos</div></div>
    <div class="stat"><div class="num">${leidos}</div><div class="lbl">Ya leídos</div></div>
    <div class="stat"><div class="num">${tengo}</div><div class="lbl">Ya los tengo</div></div>
  `;
}

function renderBreakdownBlock(container, field){
  const counts = {};
  books.forEach(b=>{
    const v = (b[field]||'').trim();
    if(!v) return;
    counts[v] = (counts[v]||0)+1;
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(entries.length===0){
    container.innerHTML = `<div class="empty-note">Todavía no hay datos suficientes.</div>`;
    return;
  }
  const max = entries[0][1];
  container.innerHTML = entries.map(([name,count])=>`
    <div class="bar-row">
      <div class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
      <div class="count">${count}</div>
    </div>
  `).join('');
}

function renderBreakdowns(){
  renderBreakdownBlock($('#breakdownLista'), 'lista');
  renderBreakdownBlock($('#breakdownTematica'), 'tematica');
}

function renderListaFilterOptions(){
  const sel = $('#listaFilter');
  const current = sel.value;
  const listas = [...new Set(books.map(b=>b.lista).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">Todas las listas</option>` + listas.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
  sel.value = listas.includes(current) ? current : '';
}

function getFiltered(){
  const q = $('#searchInput').value.trim().toLowerCase();
  const listaFilter = $('#listaFilter').value;
  let out = books.filter(b=>{
    if(listaFilter && b.lista !== listaFilter) return false;
    const leidoFilter = $('#leidoFilter').value;
    if(leidoFilter === 'si' && !b.leido) return false;
    if(leidoFilter === 'no' && b.leido) return false;
    const tengoFilter = $('#tengoFilter').value;
    if(tengoFilter === 'si' && !b.tengo) return false;
    if(tengoFilter === 'no' && b.tengo) return false;
    const favoritoFilter = $('#favoritoFilter').value;
    if(favoritoFilter && (b.favorito||0) < Number(favoritoFilter)) return false;
    if(!q) return true;
    const estado = [b.leido ? 'leído leido' : 'no leído no leido pendiente', b.tengo ? 'tengo' : 'por comprar comprar'].join(' ');
    const hay = [b.titulo,b.autor,b.editorial,b.tematica,b.lista,b.referencia,estado].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const sortBy = $('#sortSelect').value;
  out.sort((a,b)=>{
    if(sortBy==='favorito'){
      if((b.favorito||0) !== (a.favorito||0)) return (b.favorito||0) - (a.favorito||0);
      return (a.titulo||'').localeCompare(b.titulo||'');
    }
    if(sortBy==='orden'){
      const ao = a.orden==null || a.orden==='' ? Infinity : Number(a.orden);
      const bo = b.orden==null || b.orden==='' ? Infinity : Number(b.orden);
      if(ao!==bo) return ao-bo;
      return (a.titulo||'').localeCompare(b.titulo||'');
    }
    if(sortBy==='reciente') return b.id - a.id;
    return (a[sortBy]||'').localeCompare(b[sortBy]||'');
  });
  return out;
}

function renderGrid(){
  const list = getFiltered();
  $('#countLine').textContent = `${list.length} de ${books.length} libro${books.length===1?'':'s'}`;

  if(books.length===0){
    grid.innerHTML = '';
    grid.insertAdjacentHTML('afterend', '');
    grid.style.display='none';
    if(!document.getElementById('emptyState')){
      const div = document.createElement('div');
      div.id='emptyState';
      div.className='empty-state';
      div.innerHTML = `<h3>Tu pila de lectura está vacía</h3><p>Añade el primer libro que quieres leer: título, autor, editorial, y si viene de alguna lista de "mejores libros", su posición y una breve nota.</p><button class="btn primary" onclick="openAdd()">+ Añadir libro</button>`;
      grid.parentNode.insertBefore(div, grid.nextSibling);
    }
    return;
  } else {
    grid.style.display='grid';
    const es = document.getElementById('emptyState');
    if(es) es.remove();
  }

  if(list.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><h3>Sin resultados</h3><p>Prueba con otro término de búsqueda o quita el filtro de lista.</p></div>`;
    return;
  }

  grid.innerHTML = list.map(b=>`
    <div class="card" onclick="openEdit(${b.id})">
      ${b.favorito > 0 ? `<div class="fav-stars">${'★'.repeat(b.favorito)}</div>` : ''}
      ${b.orden ? `<div class="ribbon">Nº ${escapeHtml(b.orden)}</div>` : ''}
      ${b.lista ? `<div class="lista-tag">${escapeHtml(b.lista)}</div>` : ''}
      <h2>${escapeHtml(b.titulo || 'Sin título')}</h2>
      ${b.autor ? `<div class="autor">${escapeHtml(b.autor)}</div>` : ''}
      ${b.editorial ? `<div class="editorial smallcaps">${escapeHtml(b.editorial)}</div>` : ''}
      ${b.tematica ? `<div class="tematica">${escapeHtml(b.tematica)}</div>` : ''}
      ${b.referencia ? `<div class="referencia">${escapeHtml(b.referencia)}</div>` : ''}
      <div class="status-row">
        <span class="status-badge leido ${b.leido ? 'on' : ''}">${b.leido ? 'Leído' : 'No leído'}</span>
        <span class="status-badge tengo ${b.tengo ? 'on' : ''}">${b.tengo ? 'Tengo' : 'Por comprar'}</span>
      </div>
    </div>
  `).join('');
}

function openAdd(){
  editingId = null;
  $('#modalTitle').textContent = 'Añadir libro';
  $('#btnDelete').style.display='none';
  form.reset();
  setToggle($('#toggleLeido'), 'no');
  setToggle($('#toggleTengo'), 'no');
  currentFavorito = 0;
  renderStarPicker();
  overlay.classList.add('open');
  $('#f_titulo').focus();
}

function openEdit(id){
  const b = books.find(x=>x.id===id);
  if(!b) return;
  editingId = id;
  $('#modalTitle').textContent = 'Editar libro';
  $('#btnDelete').style.display='inline-block';
  $('#f_titulo').value = b.titulo||'';
  $('#f_autor').value = b.autor||'';
  $('#f_editorial').value = b.editorial||'';
  $('#f_lista').value = b.lista||'';
  $('#f_orden').value = b.orden||'';
  $('#f_tematica').value = b.tematica||'';
  $('#f_referencia').value = b.referencia||'';
  setToggle($('#toggleLeido'), b.leido ? 'si' : 'no');
  setToggle($('#toggleTengo'), b.tengo ? 'si' : 'no');
  currentFavorito = b.favorito || 0;
  renderStarPicker();
  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
  editingId = null;
}

form.addEventListener('submit', e=>{
  e.preventDefault();
  const data = {
    titulo: $('#f_titulo').value.trim(),
    autor: $('#f_autor').value.trim(),
    editorial: $('#f_editorial').value.trim(),
    lista: $('#f_lista').value.trim(),
    orden: $('#f_orden').value.trim(),
    tematica: $('#f_tematica').value.trim(),
    referencia: $('#f_referencia').value.trim(),
    leido: getToggle($('#toggleLeido')) === 'si',
    tengo: getToggle($('#toggleTengo')) === 'si',
    favorito: currentFavorito,
  };
  if(!data.titulo){ $('#f_titulo').focus(); return; }
  if(editingId){
    const b = books.find(x=>x.id===editingId);
    Object.assign(b, data);
  } else {
    books.push({ id: nextId++, ...data });
  }
  closeModal();
  render();
});

$('#btnDelete').addEventListener('click', ()=>{
  if(editingId && confirm('¿Eliminar este libro de la pila de lectura?')){
    books = books.filter(x=>x.id!==editingId);
    closeModal();
    render();
  }
});

$('#btnCancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });

$('#btnAdd').addEventListener('click', openAdd);
$('#searchInput').addEventListener('input', renderGrid);
$('#sortSelect').addEventListener('change', renderGrid);
$('#listaFilter').addEventListener('change', renderGrid);
$('#leidoFilter').addEventListener('change', renderGrid);
$('#tengoFilter').addEventListener('change', renderGrid);
$('#favoritoFilter').addEventListener('change', renderGrid);

let currentFavorito = 0;
function renderStarPicker(){
  document.querySelectorAll('#starPicker .star-btn').forEach(btn=>{
    btn.classList.toggle('filled', Number(btn.dataset.value) <= currentFavorito);
  });
}
$('#starPicker').addEventListener('click', e=>{
  const btn = e.target.closest('.star-btn');
  if(!btn) return;
  const val = Number(btn.dataset.value);
  currentFavorito = (currentFavorito === val) ? val - 1 : val;
  renderStarPicker();
});

function setToggle(groupEl, value){
  groupEl.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.value === value);
  });
}
function getToggle(groupEl){
  const active = groupEl.querySelector('.toggle-btn.active');
  return active ? active.dataset.value : 'no';
}
document.querySelectorAll('.toggle-group').forEach(group=>{
  group.addEventListener('click', e=>{
    const btn = e.target.closest('.toggle-btn');
    if(!btn) return;
    setToggle(group, btn.dataset.value);
  });
});

$('#btnDownload').addEventListener('click', ()=>{
  const rows = books.map(b=>({
    'ID': b.id,
    'Título': b.titulo,
    'Autor': b.autor,
    'Editorial': b.editorial,
    'Lista de origen': b.lista,
    'Orden': b.orden,
    'Temática': b.tematica,
    'Referencia': b.referencia,
    'Leído': b.leido ? 'Sí' : 'No',
    'Tengo': b.tengo ? 'Sí' : 'No',
    'Favorito': b.favorito ? '★'.repeat(b.favorito) : '',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:38},{wch:24},{wch:22},{wch:30},{wch:8},{wch:20},{wch:40},{wch:8},{wch:8},{wch:8}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Por leer');
  XLSX.writeFile(wb, 'BBL_PL.xlsx');
});

render();
renderStarPicker();
</script>
